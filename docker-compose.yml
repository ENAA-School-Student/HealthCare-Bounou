version: '3.8'

services:
  mysqldb:
    image: mysql:latest
    container_name: healthcare-mysql
    environment:
      MYSQL_DATABASE: healthcare_db
      MYSQL_ROOT_PASSWORD: 230223
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p230223"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: healthcare-backend
    ports:
      - "8081:8080"
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/healthcare_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 230223
      JWT_SECRET: 1f34d8475a9b477cab046569b3fb3a3db089ac2b32c0c2e254323e81494eb9c9
      JWT_EXPIRATION: 360000
    restart: on-failure

volumes:
  mysql_data:
